name: Instagram to Telegram Backup

on:
  schedule:
    # Runs every 5 hours (UTC). GitHub may delay scheduled runs a few minutes.
    - cron: '0 */5 * * *'
  workflow_dispatch: # Allows manual "Run workflow" from the Actions tab

# Allow the workflow to commit and push the updated state.json back to the repo
permissions:
  contents: write

concurrency:
  group: instagram-to-telegram
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Instagram to Telegram scraper
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scraper.py

      - name: Commit and push updated state.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Only state.json is ever committed - downloaded media is deleted
          # by scraper.py and also protected by .gitignore (downloads/).
          git add state.json
          if git diff --cached --quiet; then
            echo "No changes to state.json - nothing to commit."
          else
            git commit -m "Update state.json [skip ci]"
            git push
          fi
